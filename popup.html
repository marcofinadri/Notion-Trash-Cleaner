<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notion Trash Cleaner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .icon-wrap {
      width: 36px;
      height: 36px;
      background: #e03e3e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    p {
      font-size: 12px;
      color: #999;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #ccc;
    }

    .step-num {
      width: 18px;
      height: 18px;
      background: #333;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      color: #e03e3e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 14px 0;
    }

    .note {
      font-size: 11px;
      color: #666;
      line-height: 1.8;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #e03e3e;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .open-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px 0;
      background: #e03e3e;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .open-btn:hover {
      background: #c93232;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
    </div>
    <h1>Notion Trash Cleaner</h1>
  </div>

  <p data-i18n="popupDescription"></p>

  <div class="step">
    <div class="step-num">1</div>
    <span data-i18n="popupStep1"></span>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <span data-i18n="popupStep2"></span>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <span data-i18n="popupStep3"></span>
  </div>

  <a class="open-btn" href="https://app.notion.com" target="_blank" data-i18n="popupOpenNotion"></a>

  <hr class="divider">

  <p class="note">
    <span class="dot"></span><span data-i18n="popupNote1"></span><br>
    <span class="dot"></span><span data-i18n="popupNote2"></span><br>
    <span class="dot"></span><span data-i18n="popupNote3"></span>
  </p>

  <script src="popup.js"></script>
</body>
</html>
